services:
  vps-api:
    image: node:22.12.0-alpine
    container_name: vps-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "/app/vps-api/vps-api-server.js"]
    volumes:
      - ../:/app:ro
    env_file:
      - /opt/vps-secrets/vibe-cooking-vps.env
    environment:
      - PORT=8080
    expose:
      - "8080"

  vps-caddy:
    image: caddy:2-alpine
    container_name: vps-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
